name: One-time dependency lockfile refresh

on:
  push:
    branches: ["security/upgrade-next-dependencies-20261022"]
    paths: [".github/workflows/refresh-security-lockfile.yml"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security/upgrade-next-dependencies-20261022
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: Refresh lockfile for updated package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply non-breaking npm security fixes
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Install updated dependencies
        run: npm ci
      - name: Validate static site build
        run: npm run build
      - name: Commit lockfile and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/refresh-security-lockfile.yml
          git commit -m "Regenerate and validate secure dependency lockfile"
          git push origin HEAD:security/upgrade-next-dependencies-20261022
