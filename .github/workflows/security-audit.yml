name: Dependency security audit

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts
      - name: Check production dependencies for high and critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Check all dependencies for high and critical vulnerabilities
        if: success() || failure()
        run: node scripts/check-security-audit.mjs
